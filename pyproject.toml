[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-text2sql"
version = "0.1.0"
description = "Single-GPU, execution-guided post-training for Text-to-SQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "sqlglot>=30,<31",
]

[project.optional-dependencies]
data = [
  "transformers>=4.48,<5",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
text2sql-prepare-data = "text2sql.cli.prepare_data:main"
text2sql-validate-data = "text2sql.cli.validate_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
